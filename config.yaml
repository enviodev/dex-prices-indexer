# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: dex-prices-indexer
# Entity rows, entity history and reorg rollback are scoped per chain, and
# Postgres tables are LIST-partitioned on chainId. Inherited from
# uniswap-v4-indexer; see that repo's commit 6e36ad0.
disable_default_cross_chain: true
# Postgres only. ClickHouse is deliberately off the serving path for the DEX
# Prices API; see envio-apis decisions/0010.
storage:
  postgres: true
  clickhouse: false
contracts:
  # Uniswap V4. Only the three events the pricing model reads are declared:
  # an event with no handler is never fetched, so the rest were dead weight in
  # the config and misdescribed the indexer.
  - name: PoolManager
    events:
      - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)
      - event: ModifyLiquidity(bytes32 indexed id, address indexed sender, int24 tickLower, int24 tickUpper, int256 liquidityDelta, bytes32 salt)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
      - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
chains:
