# dex-prices-indexer schema
#
# Scoped to what the DEX Prices API serves. Postgres only — `storage` in
# config.yaml sets `clickhouse: false` for the whole project, so entity
# history is pruned back to each chain's safe checkpoint instead of being kept
# forever. What this dropped from the upstream uniswap-v4-indexer schema, and
# why, is in the README.

# A trade. Written once, never updated.
type Swap
  @index(fields: ["pool", ["timestamp", "DESC"]])
  @index(fields: ["token0", ["timestamp", "DESC"]])
  @index(fields: ["token1", ["timestamp", "DESC"]]) {
  id: ID! # {chainId}_{blockNumber}_{logIndex}
  # Not indexed: it has one value today, so an index would be pure write cost.
  dex: String!
  transaction: String!
  blockNumber: BigInt!
  timestamp: BigInt! @index
  pool: String!
  token0: Token!
  token1: Token!
  sender: String!
  origin: String! # the EOA that initiated the txn
  amount0: BigDecimal!
  amount1: BigDecimal!
  amountUSD: BigDecimal!
  # Each token's USD price at this swap, from the derivedETH and ethPriceUSD
  # in force when it was processed. The only honest per-swap USD price: the
  # pool's sqrtPriceX96 gives a ratio, and converting it later is impossible
  # because derivedETH and ethPriceUSD are not historised.
  priceUSD0: BigDecimal!
  priceUSD1: BigDecimal!
  sqrtPriceX96: BigInt!
  tick: BigInt!
  logIndex: BigInt!
  # Fee actually paid for this swap, in hundredths of a bip. For dynamic-fee
  # pools this is the per-swap effective fee, not Pool.feeTier.
  fee: BigInt!
}

type Pool
  @index(fields: ["token0", ["volumeUSD", "DESC"]])
  @index(fields: ["token1", ["volumeUSD", "DESC"]])
  @index(fields: ["hooks", ["totalValueLockedUSD", "DESC"]]) {
  id: ID! # {chainId}_{poolId}. Opaque: a V4 bytes32 pool id or, for a future
  # DEX, a pool address.
  dex: String!
  createdAtTimestamp: BigInt! @index
  createdAtBlockNumber: BigInt!
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlock: BigInt!
  token0: String!
  token1: String!
  # The fee the pool was initialised with. Never overwritten — upstream wrote
  # the last swap's fee here, which lost the configured fee on dynamic-fee
  # pools.
  feeTier: BigInt!
  # Fee observed on the most recent swap. Equals feeTier for a static-fee pool.
  lastSwapFee: BigInt!
  liquidity: BigInt!
  sqrtPrice: BigInt!
  tick: BigInt
  tickSpacing: BigInt! # Uniswap V4 specific
  hooks: String! # Uniswap V4 specific; the zero address for a DEX without hooks
  token0Price: BigDecimal!
  token1Price: BigDecimal!
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal! @index
  untrackedVolumeUSD: BigDecimal!
  feesUSD: BigDecimal!
  txCount: BigInt! @index
  totalValueLockedToken0: BigDecimal!
  totalValueLockedToken1: BigDecimal!
  totalValueLockedETH: BigDecimal!
  totalValueLockedUSD: BigDecimal! @index
}

type Token {
  id: ID! # {chainId}_{address}
  symbol: String!
  name: String!
  decimals: BigInt!
  totalSupply: BigInt!
  # Price in the chain's native token, and the same price in USD. priceUSD is
  # written here rather than multiplied at request time so the price endpoint
  # is one read.
  derivedETH: BigDecimal!
  priceUSD: BigDecimal!
  # False when no whitelisted pricing route reaches this token, so the API can
  # answer "no price" instead of returning zero.
  isPriceable: Boolean! @index
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlock: BigInt!
  volume: BigDecimal!
  volumeUSD: BigDecimal!
  feesUSD: BigDecimal!
  txCount: BigInt!
  poolCount: BigInt!
  totalValueLocked: BigDecimal!
  totalValueLockedUSD: BigDecimal!
}

# Pools a token can be priced through, written on Initialize and read by
# findNativePerToken. Kept as its own entity rather than an array on Token:
# as an array it was rewritten on every swap and became ~80% of the upstream
# project's ClickHouse database (enviodev/uniswap-v4-indexer#67).
type TokenWhitelistPools {
  id: ID! # same id as the Token
  pools: [String!]!
}

# The chain's native token price in USD. One row per chain, id = chainId.
type Bundle {
  id: ID!
  ethPriceUSD: BigDecimal!
}

# Uniswap V4 specific.
type HookStats {
  id: ID! # {chainId}_{hookAddress}
  numberOfPools: BigInt!
  numberOfSwaps: BigInt!
  firstPoolCreatedAt: BigInt!
  totalValueLockedUSD: BigDecimal! @index
  totalVolumeUSD: BigDecimal!
  untrackedVolumeUSD: BigDecimal!
  totalFeesUSD: BigDecimal!
}

# OHLCV for a token's USD price. A row exists only for a bucket that had a
# swap, so the row count is bounded by swaps, not by tokens x buckets.
#
# If ClickHouse is ever enabled for this project, the candle entities must be
# excluded from it: an open candle is rewritten by every swap in its bucket,
# and ClickHouse keeps every version forever. That shape is what caused
# enviodev's September 2026 history-bloat incident.
type TokenCandle
  @index(fields: ["token", "interval", ["bucketStart", "DESC"]]) {
  id: ID! # {chainId}_{tokenAddress}_{interval}_{bucketStart}
  token: Token!
  interval: String! # 1m | 5m | 1h | 1d
  bucketStart: BigInt!
  open: BigDecimal!
  high: BigDecimal!
  low: BigDecimal!
  close: BigDecimal!
  volumeToken: BigDecimal!
  volumeUSD: BigDecimal!
  swapCount: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# OHLCV of one token0 priced in token1 (Pool.token1Price), plus the pool's
# volume in the bucket. 1h and 1d only: per-pool fine granularity serves no
# endpoint, and summing 24 of the 1h rows is the source for 24-hour volume.
type PoolCandle
  @index(fields: ["pool", "interval", ["bucketStart", "DESC"]]) {
  id: ID! # {chainId}_{poolId}_{interval}_{bucketStart}
  pool: String!
  dex: String!
  interval: String! # 1h | 1d
  bucketStart: BigInt!
  open: BigDecimal!
  high: BigDecimal!
  low: BigDecimal!
  close: BigDecimal!
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal!
  swapCount: BigInt!
  lastUpdatedTimestamp: BigInt!
}
