name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # No codegen step: envio >= 3.14 runs codegen as part of `envio start`
      # and `envio dev`, so the on-disk types stay in sync without a separate
      # invocation.

      # ENVIO_API_TOKEN is optional. Without it the HyperSync replay test in
      # src/indexer.test.ts skips itself and the pure unit tests still run, so
      # CI is green on a repository with no secret configured. Add the secret
      # to get the end-to-end test as well.
      - name: Run tests
        run: pnpm test
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
